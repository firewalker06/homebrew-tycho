name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae --junit --fail-fast
        if: github.event_name == 'pull_request'

      - name: Verify required build, test, and bottle output
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          brew install python@3.14
          python="$(brew --prefix python@3.14)/bin/python3.14"
          tap="$(brew --repository firewalker06/tycho)"
          "$python" "$tap/test/verify_bottles_test.py"
          version="$(brew info --json=v2 firewalker06/tycho/tycho | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("formulae").first.fetch("versions").fetch("stable")')"
          tag="$(brew ruby -e 'require "utils/bottles"; puts Utils::Bottles.tag')"
          "$python" "$tap/scripts/verify-bottles.py" --version "$version" --tag "$tag"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: |
            *.bottle.*
            bottle-verification.json
            brew-test-bot.xml
            steps_output.txt
            skipped_or_failed_formulae-*.txt
            logs/tycho/**
          if-no-files-found: error
          retention-days: 7
